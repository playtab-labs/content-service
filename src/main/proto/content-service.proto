syntax = "proto3";

package content.v1;

option java_multiple_files = true;
option java_package = "com.playtab.contentservice.grpc.proto.v1";
option java_outer_classname = "ContentProto";

service ContentService {
  rpc GetFoodTrucks(GetFoodTrucksRequest) returns (GetFoodTrucksResponse);
  rpc GetPubs(GetPubsRequest) returns (GetPubsResponse);
  rpc GetMdItems(GetMdItemsRequest) returns (GetMdItemsResponse);
  rpc GetMdItemDetail(GetMdItemDetailRequest) returns (GetMdItemDetailResponse);
  rpc GetNotices(GetNoticesRequest) returns (GetNoticesResponse);
  rpc GetNoticeDetail(GetNoticeDetailRequest) returns (GetNoticeDetailResponse);

  rpc AdminCreateNotice(AdminCreateNoticeRequest) returns (AdminCreateNoticeResponse);
  rpc AdminUpdateNotice(AdminUpdateNoticeRequest) returns (AdminUpdateNoticeResponse);
  rpc AdminDeleteNotice(AdminDeleteNoticeRequest) returns (AdminDeleteNoticeResponse);

  rpc AdminCreateFoodTruck(AdminCreateFoodTruckRequest) returns (AdminCreateFoodTruckResponse);
  rpc AdminUpdateFoodTruck(AdminUpdateFoodTruckRequest) returns (AdminUpdateFoodTruckResponse);
  rpc AdminDeleteFoodTruck(AdminDeleteFoodTruckRequest) returns (AdminDeleteFoodTruckResponse);

  rpc AdminCreatePub(AdminCreatePubRequest) returns (AdminCreatePubResponse);
  rpc AdminUpdatePub(AdminUpdatePubRequest) returns (AdminUpdatePubResponse);
  rpc AdminDeletePub(AdminDeletePubRequest) returns (AdminDeletePubResponse);

  rpc AdminCreateMdItem(AdminCreateMdItemRequest) returns (AdminCreateMdItemResponse);
  rpc AdminUpdateMdItem(AdminUpdateMdItemRequest) returns (AdminUpdateMdItemResponse);
  rpc AdminDeleteMdItem(AdminDeleteMdItemRequest) returns (AdminDeleteMdItemResponse);

  rpc AdminCreateMdOptionGroup(AdminCreateMdOptionGroupRequest) returns (AdminCreateMdOptionGroupResponse);
  rpc AdminUpdateMdOptionGroup(AdminUpdateMdOptionGroupRequest) returns (AdminUpdateMdOptionGroupResponse);
  rpc AdminDeleteMdOptionGroup(AdminDeleteMdOptionGroupRequest) returns (AdminDeleteMdOptionGroupResponse);

  rpc AdminCreateMdOptionValue(AdminCreateMdOptionValueRequest) returns (AdminCreateMdOptionValueResponse);
  rpc AdminUpdateMdOptionValue(AdminUpdateMdOptionValueRequest) returns (AdminUpdateMdOptionValueResponse);
  rpc AdminDeleteMdOptionValue(AdminDeleteMdOptionValueRequest) returns (AdminDeleteMdOptionValueResponse);
}

message PageRequest {
  int32 page = 1;
  int32 size = 2;
}

message PageInfo {
  int32 page = 1;
  int32 size = 2;
  int64 total_elements = 3;
  int32 total_pages = 4;
  bool has_next = 5;
}

message GetFoodTrucksRequest {
  string locale = 1;
  bool only_visible = 2;
}

message GetFoodTrucksResponse {
  repeated FoodTruckItem food_trucks = 1;
}

message FoodTruckItem {
  int64 id = 1;
  string name = 2;
  string thumbnail_image_url = 3;
  string short_description = 4;
  int32 display_order = 5;
}

message GetPubsRequest {
  string locale = 1;
  bool only_visible = 2;
}

message GetPubsResponse {
  repeated PubItem pubs = 1;
}

message PubItem {
  int64 id = 1;
  string college_name = 2;
  string thumbnail_image_url = 3;
  bool is_name_confirmed = 4;
  int32 display_order = 5;
}

message GetMdItemsRequest {
  string locale = 1;
  bool only_visible = 2;
  PageRequest page_request = 3;
}

message GetMdItemsResponse {
  repeated MdItemSummary items = 1;
  PageInfo page_info = 2;
}

message MdItemSummary {
  int64 id = 1;
  string name = 2;
  string thumbnail_image_url = 3;
  int32 price = 4;
  bool is_sold_out = 5;
}

message GetMdItemDetailRequest {
  string locale = 1;
  int64 md_item_id = 2;
}

message GetMdItemDetailResponse {
  MdItemDetail item = 1;
}

message MdItemDetail {
  int64 id = 1;
  string name = 2;
  string thumbnail_image_url = 3;
  string detail_image_url = 4;
  int32 price = 5;
  bool is_sold_out = 6;
  string product_description = 7;
  string detail_description = 8;
  repeated MdOptionGroup option_groups = 9;
}

message MdOptionGroup {
  int64 id = 1;
  string name = 2;
  int32 display_order = 3;
  repeated MdOptionValue values = 4;
}

message MdOptionValue {
  int64 id = 1;
  string value_name = 2;
  int32 extra_price = 3;
  bool is_sold_out = 4;
  int32 display_order = 5;
}

message GetNoticesRequest {
  string locale = 1;
  bool only_visible = 2;
  PageRequest page_request = 3;
}

message GetNoticesResponse {
  repeated NoticeSummary notices = 1;
  PageInfo page_info = 2;
}

message NoticeSummary {
  int64 id = 1;
  string title = 2;
  string posted_at = 3;
  bool is_pinned = 4;
  string image_url = 5;
  string content_preview = 6;
}

message GetNoticeDetailRequest {
  string locale = 1;
  int64 notice_id = 2;
}

message GetNoticeDetailResponse {
  NoticeDetail notice = 1;
}

message NoticeDetail {
  int64 id = 1;
  string title = 2;
  string content = 3;
  string posted_at = 4;
  bool is_pinned = 5;
  string image_url = 6;
}

message AdminNotice {
  int64 id = 1;
  map<string, string> title = 2;
  map<string, string> content = 3;
  string posted_at = 4;
  bool is_pinned = 5;
  bool is_visible = 6;
  string image_url = 7;
  string created_at = 8;
  string updated_at = 9;
}

message AdminCreateNoticeRequest {
  map<string, string> title = 1;
  map<string, string> content = 2;
  string posted_at = 3;
  bool is_pinned = 4;
  bool is_visible = 5;
  string image_url = 6;
}

message AdminCreateNoticeResponse {
  AdminNotice notice = 1;
}

message AdminUpdateNoticeRequest {
  int64 id = 1;
  map<string, string> title = 2;
  map<string, string> content = 3;
  string posted_at = 4;
  bool is_pinned = 5;
  bool is_visible = 6;
  string image_url = 7;
}

message AdminUpdateNoticeResponse {
  AdminNotice notice = 1;
}

message AdminDeleteNoticeRequest {
  int64 id = 1;
}

message AdminDeleteNoticeResponse {
  bool success = 1;
}

message AdminFoodTruck {
  int64 id = 1;
  map<string, string> name = 2;
  map<string, string> short_description = 3;
  string thumbnail_image_url = 4;
  int32 display_order = 5;
  bool is_visible = 6;
  string created_at = 7;
  string updated_at = 8;
}

message AdminCreateFoodTruckRequest {
  map<string, string> name = 1;
  map<string, string> short_description = 2;
  string thumbnail_image_url = 3;
  int32 display_order = 4;
  bool is_visible = 5;
}

message AdminCreateFoodTruckResponse {
  AdminFoodTruck food_truck = 1;
}

message AdminUpdateFoodTruckRequest {
  int64 id = 1;
  map<string, string> name = 2;
  map<string, string> short_description = 3;
  string thumbnail_image_url = 4;
  int32 display_order = 5;
  bool is_visible = 6;
}

message AdminUpdateFoodTruckResponse {
  AdminFoodTruck food_truck = 1;
}

message AdminDeleteFoodTruckRequest {
  int64 id = 1;
}

message AdminDeleteFoodTruckResponse {
  bool success = 1;
}

message AdminPub {
  int64 id = 1;
  map<string, string> college_name = 2;
  bool is_name_confirmed = 3;
  string thumbnail_image_url = 4;
  int32 display_order = 5;
  bool is_visible = 6;
  string created_at = 7;
  string updated_at = 8;
}

message AdminCreatePubRequest {
  map<string, string> college_name = 1;
  bool is_name_confirmed = 2;
  string thumbnail_image_url = 3;
  int32 display_order = 4;
  bool is_visible = 5;
}

message AdminCreatePubResponse {
  AdminPub pub = 1;
}

message AdminUpdatePubRequest {
  int64 id = 1;
  map<string, string> college_name = 2;
  bool is_name_confirmed = 3;
  string thumbnail_image_url = 4;
  int32 display_order = 5;
  bool is_visible = 6;
}

message AdminUpdatePubResponse {
  AdminPub pub = 1;
}

message AdminDeletePubRequest {
  int64 id = 1;
}

message AdminDeletePubResponse {
  bool success = 1;
}

message AdminMdItem {
  int64 id = 1;
  map<string, string> name = 2;
  int32 price = 3;
  map<string, string> product_description = 4;
  map<string, string> detail_description = 5;
  string thumbnail_image_url = 6;
  string detail_image_url = 7;
  bool is_sold_out = 8;
  int32 display_order = 9;
  bool is_visible = 10;
  string created_at = 11;
  string updated_at = 12;
}

message AdminCreateMdItemRequest {
  map<string, string> name = 1;
  int32 price = 2;
  map<string, string> product_description = 3;
  map<string, string> detail_description = 4;
  string thumbnail_image_url = 5;
  string detail_image_url = 6;
  bool is_sold_out = 7;
  int32 display_order = 8;
  bool is_visible = 9;
}

message AdminCreateMdItemResponse {
  AdminMdItem md_item = 1;
}

message AdminUpdateMdItemRequest {
  int64 id = 1;
  map<string, string> name = 2;
  int32 price = 3;
  map<string, string> product_description = 4;
  map<string, string> detail_description = 5;
  string thumbnail_image_url = 6;
  string detail_image_url = 7;
  bool is_sold_out = 8;
  int32 display_order = 9;
  bool is_visible = 10;
}

message AdminUpdateMdItemResponse {
  AdminMdItem md_item = 1;
}

message AdminDeleteMdItemRequest {
  int64 id = 1;
}

message AdminDeleteMdItemResponse {
  bool success = 1;
}

message AdminMdOptionGroup {
  int64 id = 1;
  int64 md_item_id = 2;
  map<string, string> name = 3;
  int32 display_order = 4;
  string created_at = 5;
  string updated_at = 6;
}

message AdminCreateMdOptionGroupRequest {
  int64 md_item_id = 1;
  map<string, string> name = 2;
  int32 display_order = 3;
}

message AdminCreateMdOptionGroupResponse {
  AdminMdOptionGroup option_group = 1;
}

message AdminUpdateMdOptionGroupRequest {
  int64 id = 1;
  map<string, string> name = 2;
  int32 display_order = 3;
}

message AdminUpdateMdOptionGroupResponse {
  AdminMdOptionGroup option_group = 1;
}

message AdminDeleteMdOptionGroupRequest {
  int64 id = 1;
}

message AdminDeleteMdOptionGroupResponse {
  bool success = 1;
}

message AdminMdOptionValue {
  int64 id = 1;
  int64 option_group_id = 2;
  map<string, string> value_name = 3;
  int32 extra_price = 4;
  bool is_sold_out = 5;
  int32 display_order = 6;
  string created_at = 7;
  string updated_at = 8;
}

message AdminCreateMdOptionValueRequest {
  int64 option_group_id = 1;
  map<string, string> value_name = 2;
  int32 extra_price = 3;
  bool is_sold_out = 4;
  int32 display_order = 5;
}

message AdminCreateMdOptionValueResponse {
  AdminMdOptionValue option_value = 1;
}

message AdminUpdateMdOptionValueRequest {
  int64 id = 1;
  map<string, string> value_name = 2;
  int32 extra_price = 3;
  bool is_sold_out = 4;
  int32 display_order = 5;
}

message AdminUpdateMdOptionValueResponse {
  AdminMdOptionValue option_value = 1;
}

message AdminDeleteMdOptionValueRequest {
  int64 id = 1;
}

message AdminDeleteMdOptionValueResponse {
  bool success = 1;
}